version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@chakra-ui/react"
        update-types: ["version-update:semver-major"]
      # eslint-config-next plugins lack ESLint 10 support; see #112 for when to remove
      - dependency-name: "eslint"
        versions: [">=10"]
      # typescript-eslint peer range is <6.1.0 and eslint crashes on TS 7; remove once it supports TS 7.1+
      # (https://github.com/typescript-eslint/typescript-eslint/issues/10940)
      - dependency-name: "typescript"
        versions: [">=7"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      docker-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Only track LTS (even) Node majors; odd majors are never promoted to LTS
      - dependency-name: "node"
        versions: ["27.x", "29.x", "31.x"]
