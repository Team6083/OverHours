name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Placeholder only: prisma generate and next build never connect to the DB.
  DATABASE_URL: mongodb://placeholder/db
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Dockerfile uses node:lts-alpine; package.json engines is >=20.19.0.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      # TODO(oh-03): main currently has lint errors (react-hooks/*, no-explicit-any).
      # Remove continue-on-error once they are fixed so this step gates merges.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build
